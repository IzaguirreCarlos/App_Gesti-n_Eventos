version: '3.9'

x-common-env: &common-env
  DATABASE_URL: postgres://eventpro:eventpro_secret@db:5432/eventpro
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: dev-secret-key-change-in-production-please
  DJANGO_SETTINGS_MODULE: config.settings.production
  ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  DEBUG: "True"

services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: eventpro
      POSTGRES_USER: eventpro
      POSTGRES_PASSWORD: eventpro_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment:
      <<: *common-env
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 120
      --access-logfile -
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery:
    build: .
    command: >
      celery -A config worker
      -l INFO
      --concurrency 2
      -E
    volumes:
      - media_files:/app/media
    environment:
      <<: *common-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: >
      celery -A config beat
      -l INFO
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - media_files:/app/media
    environment:
      <<: *common-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
